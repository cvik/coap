name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: Build examples and benchmark tools
        run: zig build

      - name: Run tests
        run: zig build test

      - name: Build optimized artifacts
        run: zig build -Doptimize=fast

      - name: Remote benchmark integration
        run: |
          sudo prlimit --pid $$ --memlock=8388608:8388608
          python3 bench/remote-smoke.py
